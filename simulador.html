<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pensiones — Simulador</title>

<style>
:root{
  --bg:#252525;
  --panel:#2b2b2b;
  --stroke:#3a3a3a;
  --primary:#FEF702;
  --text:#B0B0B0;
  --workers:#36C3FF;
  --retired:#FF6A00;
}

*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,system-ui;
}

header{
  padding:18px;
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
}
h1{
  margin:0;
  font-family:Futura,system-ui;
  color:var(--primary);
  font-size:24px;
}
header p{
  margin:6px 0 0;
  font-size:13px;
  opacity:.85;
}

main{
  display:grid;
  grid-template-columns: 1.3fr 0.7fr;
  gap:14px;
  padding:14px;
}

/* PANEL */
.panel{
  background:linear-gradient(180deg,#2e2e2e,#262626);
  border:1px solid var(--stroke);
  border-radius:14px;
  padding:14px;
}

/* ================== IZQUIERDA ================== */
.left{
  display:grid;
  grid-template-columns:60px 1fr;
  gap:12px;
}

/* slider vertical */
.vslider{
  display:flex;
  justify-content:center;
}
.vslider input{
  writing-mode:bt-lr;
  -webkit-appearance:slider-vertical;
  height:620px;
  width:24px;
  accent-color:var(--primary);
}

/* gráficas */
.graphs{
  display:grid;
  grid-template-rows:1fr auto;
  gap:16px;
}

svg{
  width:100%;
  height:100%;
  background:#1f1f1f;
  border-radius:12px;
}

/* ratio */
.ratio{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:18px;
  font-size:14px;
}
.ratio img{
  height:46px;
}
.ratio strong{
  color:var(--primary);
}

/* ================== DERECHA ================== */
.right{
  display:flex;
  flex-direction:column;
  gap:14px;
}

/* pirámide */
.pyr svg{
  height:620px;
}

/* controles */
.control{
  font-size:12px;
}
.control label{
  display:flex;
  justify-content:space-between;
}
.control input{
  width:100%;
}

/* resultado */
.result{
  padding:12px;
  border-radius:10px;
  background:#1f1f1f;
  font-size:13px;
}
.result.ok{border-left:4px solid #4caf50}
.result.bad{border-left:4px solid #ff5252}

</style>
</head>

<body>

<header>
  <div>
    <h1>Simulador del sistema de reparto</h1>
    <p>Demografía + productividad → sostenibilidad</p>
  </div>
  <a href="index.html" style="color:#bbb;text-decoration:none">Volver</a>
</header>

<main>

<!-- ================== IZQUIERDA ================== -->
<section class="panel left">

  <!-- divisor inicial -->
  <div class="vslider">
    <input id="split" type="range" min="5" max="60" value="25">
  </div>

  <div class="graphs">

    <!-- gráfica temporal -->
    <svg id="timeGraph" viewBox="0 0 1000 500"></svg>

    <!-- ratio -->
    <div class="ratio">
      <img src="figuras/noun-person-8104496.svg">
      <strong id="ratioText">3.2</strong>
      <img src="figuras/noun-person-8100160.svg">
    </div>

  </div>
</section>

<!-- ================== DERECHA ================== -->
<section class="panel right">

  <div class="pyr">
    <svg id="pyramid" viewBox="0 0 520 720"></svg>
  </div>

  <div class="control">
    <label>Productividad por trabajador <span id="prodV">1.00</span></label>
    <input id="prod" type="range" min="0.5" max="2.0" step="0.01" value="1">
  </div>

  <div class="control">
    <label>Pensión media relativa <span id="pensV">0.55</span></label>
    <input id="pens" type="range" min="0.3" max="1.0" step="0.01" value="0.55">
  </div>

  <div class="control">
    <label>Tipo de cotización <span id="cotV">0.30</span></label>
    <input id="cot" type="range" min="0.1" max="0.5" step="0.01" value="0.3">
  </div>

  <div id="result" class="result"></div>

</section>

</main>

<script>
const split = document.getElementById("split");
const prod = document.getElementById("prod");
const pens = document.getElementById("pens");
const cot  = document.getElementById("cot");

const ratioText = document.getElementById("ratioText");
const resultBox = document.getElementById("result");

function update(){
  const retiredShare = split.value / 100;
  const workersShare = 1 - retiredShare;

  const productivity = +prod.value;
  const pension      = +pens.value;
  const contrib      = +cot.value;

  const income = workersShare * productivity * contrib;
  const cost   = retiredShare * pension;

  const ratio = workersShare / retiredShare;
  ratioText.textContent = ratio.toFixed(2);

  if(income >= cost){
    resultBox.className = "result ok";
    resultBox.innerHTML =
      `<strong>SISTEMA SOSTENIBLE</strong><br>
       Ingresos ≥ Gastos<br>
       Superávit relativo: ${(income-cost).toFixed(2)}`;
  }else{
    resultBox.className = "result bad";
    resultBox.innerHTML =
      `<strong>SISTEMA NO SOSTENIBLE</strong><br>
       Ingresos < Gastos<br>
       Déficit relativo: ${(cost-income).toFixed(2)}`;
  }
}

document.querySelectorAll("input").forEach(i=>i.addEventListener("input",update));
update();
</script>

</body>
</html>
